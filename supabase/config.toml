project_id = "qualidji"

[api]
enabled = true
port = 54341
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54342
shadow_port = 54340
major_version = 17

[studio]
enabled = true
port = 54343

[auth]
enabled = true
site_url = "http://localhost:5173"
# Pages /set-password des liens d'invitation et de réinitialisation (dev : vite 5173, preview 5174).
# Production : renseigner l'URL du site dans Auth → URL Configuration du tableau de bord Supabase.
additional_redirect_urls = ["http://localhost:5173/**", "http://localhost:5174/**", "https://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.email]
# Produit sur invitation uniquement : l'inscription libre est fermée (les comptes naissent par POST /users/invite).
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[auth.email.template.invite]
subject = "Invitation à rejoindre QualiDji"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Réinitialisation de votre mot de passe QualiDji"
content_path = "./supabase/templates/recovery.html"

[storage]
enabled = true
file_size_limit = "50MiB"

[db.seed]
enabled = true
sql_paths = ["./seeds/*.sql"]

[analytics]
enabled = true
port = 54345

[inbucket]
enabled = true
port = 54346
